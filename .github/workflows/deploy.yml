name: Deploy to boos.uz

on:
  push:
    branches: [main]
  workflow_dispatch: {}

concurrency:
  group: deploy-production
  cancel-in-progress: true

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        # npm ci emas: macOS'da yaratilgan lockfile Linux'ning platform-specific
        # optional paketlarini o'z ichiga olmaydi (npm/cli#4828)
        run: npm install --no-audit --no-fund

      - name: Build (static export)
        run: npm run build

      - name: Setup SSH
        run: |
          mkdir -p ~/.ssh
          echo "${{ secrets.SSH_PRIVATE_KEY }}" > ~/.ssh/deploy_key
          chmod 600 ~/.ssh/deploy_key
          ssh-keyscan -H "${{ secrets.SERVER_HOST }}" >> ~/.ssh/known_hosts 2>/dev/null

      - name: Deploy (rsync out/ → /var/www/boos.uz)
        run: |
          rsync -az --delete \
            -e "ssh -i ~/.ssh/deploy_key" \
            out/ root@${{ secrets.SERVER_HOST }}:/var/www/boos.uz/

      - name: Verify
        run: |
          code=$(curl -s -o /dev/null -w "%{http_code}" https://boos.uz)
          echo "https://boos.uz → HTTP $code"
          test "$code" = "200"
